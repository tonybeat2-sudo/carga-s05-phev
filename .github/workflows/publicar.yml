name: Precios PVPC y publicación

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # ESIOS publica los precios del día siguiente hacia las 20:15 (hora peninsular).
    # Horas en UTC: 19:40 y 20:40 cubren invierno y verano; 23:10 es un repaso por si acaso.
    - cron: "40 19 * * *"
    - cron: "40 20 * * *"
    - cron: "10 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar precios PVPC
        continue-on-error: true
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: node precios.mjs
      - name: Guardar precios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add precios.json
          git diff --cached --quiet || (git commit -m "Precios PVPC $(date -u +%F)" && git push)
      - name: Preparar web
        run: mkdir -p _site && cp index.html precios.json icon.png manifest.webmanifest _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
